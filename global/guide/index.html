<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D2136">
<title>Rasl Estate Global · فێرکاری</title>
<style>
:root{--bg:#0D2136;--card:#102B46;--line:#2A4A6B;--ink:#FFFFFF;--mute:#A9BACB;--gold:#FFFFFF;--gold2:#C9D6E3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#081827;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(90% 80% at 70% 20%,#173F63,#0D2136 70%)}
/* landscape: phone left (visually), text right */
#frame{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:flex;align-items:center;gap:4%;padding:3% 5%}
#phoneWrap{height:88%;aspect-ratio:390/844;position:relative;flex:none}
#phone{position:absolute;inset:0;border-radius:9% / 4.2%;border:.6vmin solid #2A4A6B;background:#000;overflow:hidden;box-shadow:0 3vmin 8vmin rgba(0,0,0,.55),0 0 0 .35vmin #0B1D30 inset}
#shot{position:absolute;inset:0;transform-origin:50% 50%;transition:transform 6s ease-out}
#shot img{width:100%;height:100%;display:block;object-fit:cover}
#shot.in{animation:sin .6s ease-out}
@keyframes sin{from{opacity:0;transform:translateY(3%) scale(.97)}to{opacity:1}}
#ring{position:absolute;border:.5vmin solid var(--gold);border-radius:1.6vmin;box-shadow:0 0 0 200vmax rgba(5,8,15,.38),0 0 3vmin rgba(255,255,255,.8);opacity:0;transition:opacity .5s;pointer-events:none}
#ring.on{opacity:1;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 200vmax rgba(5,8,15,.38),0 0 6vmin rgba(255,255,255,1)}}
#tap{position:absolute;width:5vmin;height:5vmin;margin:-2.5vmin 0 0 -2.5vmin;border-radius:50%;background:rgba(255,255,255,.85);opacity:0;pointer-events:none}
#tap.go{animation:tap 1.2s ease-out}
@keyframes tap{0%{opacity:0;transform:scale(1.6)}30%{opacity:.95;transform:scale(.8)}60%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
#txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2.2vmin}
.brand{display:flex;align-items:center;gap:1.4vmin;font-weight:800;letter-spacing:.2em;font-size:1.9vmin;color:var(--gold)}
.brand i{font-style:normal;width:4.4vmin;height:4.4vmin;border-radius:50%;border:.3vmin solid var(--gold);display:grid;place-items:center;font-family:Georgia,serif;font-size:2.4vmin;letter-spacing:0}
#chT{font-size:2.3vmin;color:var(--gold2);font-weight:700}
#cap{font-size:4.1vmin;line-height:1.55;font-weight:600;min-height:30vmin}
#cap.in{animation:cin .6s ease-out}
@keyframes cin{from{opacity:0;transform:translateY(1.5vmin)}to{opacity:1}}
#dots{display:flex;gap:1vmin;flex-wrap:wrap}
#dots b{width:1.4vmin;height:1.4vmin;border-radius:1vmin;background:#3A5A7C;transition:.3s}
#dots b.on{width:4vmin;background:var(--gold)}
#bar{position:absolute;left:0;bottom:0;height:.7vmin;background:var(--gold);width:0}
/* title card */
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vmin;background:radial-gradient(70% 70% at 50% 40%,#173F63,#0D2136);text-align:center;padding:5vmin;opacity:0;pointer-events:none;transition:opacity .6s}
#card.on{opacity:1}
#card .n{font-size:2.6vmin;color:var(--gold);letter-spacing:.2em;font-weight:800}
#card h1{margin:0;font-size:7vmin;line-height:1.2}
#card p{margin:0;color:var(--mute);font-size:2.6vmin}
#card .logo{width:12vmin;height:12vmin;border-radius:50%;border:.5vmin solid var(--gold);display:grid;place-items:center;font-family:Georgia,serif;color:var(--gold);font-size:7vmin}
/* controls */
#ctl{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;padding:6px;border-radius:16px;background:rgba(12,19,33,.92);border:1px solid var(--line);z-index:5;align-items:center}
#ctl button{border:0;background:transparent;border-radius:11px;min-width:42px;height:40px;padding:0 10px;font-size:16px}
#ctl button.gold{background:var(--gold);color:#102B46}
#ctl .lg{font-size:13px;font-weight:700}
#menu{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:flex-end}
#menu .sc{width:min(520px,100%);max-height:85vh;overflow:auto;background:#102B46;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
#menu h3{margin:4px 6px 12px}
#menu button.c{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px}
#menu button.c b{width:34px;height:34px;flex:none;border-radius:10px;background:rgba(255,255,255,.15);color:var(--gold);display:grid;place-items:center}
#menu button.c span{flex:1}#menu button.c small{color:var(--mute);direction:ltr}
#menu a{display:block;text-align:center;color:var(--gold);margin-top:6px;font-size:14px}
body.rec #ctl{display:none}
/* portrait phones: phone on top, text below */
@media (orientation:portrait){
 #frame{width:100vw;height:100vh;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 18px 76px;gap:14px}
 #phoneWrap{height:58%}
 #txt{width:100%;gap:10px}
 #cap{font-size:17px;min-height:0}
 #chT{font-size:13px}.brand{font-size:11px}.brand i{width:26px;height:26px;font-size:14px}
 #dots b{width:7px;height:7px}#dots b.on{width:20px}
 #card h1{font-size:30px}#card p,#card .n{font-size:14px}
}
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <div id="phoneWrap"><div id="phone"><div id="shot"><img id="img" alt=""></div><div id="ring"></div><div id="tap"></div></div></div>
  <div id="txt"><div class="brand"><i>R</i>RASL ESTATE GLOBAL</div><div id="chT"></div><div id="cap"></div><div id="dots"></div></div>
  <div id="card"><div class="logo">R</div><div class="n" id="cN"></div><h1 id="cH"></h1><p id="cP"></p></div>
  <div id="bar"></div>
</div></div>
<div id="ctl">
  <button id="bMenu" aria-label="Chapters">☰</button>
  <button id="bPrev" aria-label="Back">⏮</button>
  <button id="bPlay" class="gold" aria-label="Play">⏸</button>
  <button id="bNext" aria-label="Next">⏭</button>
  <button id="bLang" class="lg">EN</button>
</div>
<div id="menu" class="hide"><div class="sc"><h3 id="mH"></h3><div id="mList"></div><a href="../index.html" id="mBack"></a></div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},QS=new URLSearchParams(location.search);
var LANG=QS.get('lang')||(function(){try{var l=localStorage.getItem('reg_lang');return l==='en'||l==='tr'?'en':'ku'}catch(e){return 'ku'}})();
var REC=QS.get('rec');if(REC)document.body.classList.add('rec');
var UI={ku:{part:'بەشی',of:'لە',menu:'بەشەکانی فێرکاری',back:'‹ گەڕانەوە بۆ ئەپ',intro:'فێرکاری تەواوی ئەپەکە',introP:'هەموو بەشەکان هەنگاو بە هەنگاو',end:'کۆتایی بەش',endAll:'سوپاس! ئێستا دەتوانیت دەست پێ بکەیت.',steps:'هەنگاو',vids:'ڤیدیۆکان (MP4 · بۆ ناردن و پاشەکەوت)',full:'هەموو فێرکارییەکە'},
 en:{part:'PART',of:'of',menu:'Training chapters',back:'‹ Back to the app',intro:'The complete app training',introP:'Every section, step by step',end:'End of part',endAll:'Thank you! You are ready to start.',steps:'steps',vids:'Videos (MP4 · to send or save)',full:'The whole training'}};
function u(k){return UI[LANG][k]}
function setDir(){document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ku'?'rtl':'ltr';$('bLang').textContent=LANG==='ku'?'EN':'KU';$('mH').textContent=u('menu');$('mBack').textContent=u('back')}
var CH=[],ST=[],seq=[],pos=0,playing=!QS.has('paused'),timer=0,t0=0,dur=0,raf=0;
Promise.all([fetch('chapters.json').then(function(r){return r.json()}),fetch('data.json').then(function(r){return r.json()})]).then(function(a){CH=a[0];ST=a[1];build();setDir();
 var c=REC||QS.get('c');start(c&&c!=='all'?c:null)});
function build(){var ml=$('mList');ml.innerHTML='';CH.forEach(function(c,i){var n=ST.filter(function(s){return s.ch===c.id}).length;var b=document.createElement('button');b.className='c';b.innerHTML='<b>'+(i+1)+'</b><span></span><small>'+n+'</small>';b.querySelector('span').textContent=c[LANG];b.onclick=function(){$('menu').classList.add('hide');start(c.id)};ml.appendChild(b)});
 var vh=document.createElement('h3');vh.textContent=u('vids');ml.appendChild(vh);var vw=document.createElement('div');vw.style.cssText='display:flex;flex-wrap:wrap;gap:8px';
 [{id:'all',t:u('full')}].concat(CH.map(function(c,i){return {id:c.id,t:(i+1)+'. '+c[LANG]}})).forEach(function(v){var a=document.createElement('a');a.href='video/'+v.id+'.mp4';a.target='_blank';a.rel='noopener';a.textContent='🎬 '+v.t;a.style.cssText='display:inline-block;margin:0;padding:8px 12px;border-radius:12px;border:1px solid #2A4A6B;background:#102B46;color:#C9D6E3;font-size:13px;text-decoration:none';vw.appendChild(a)});ml.appendChild(vw)}
function start(cid){seq=[];var list=cid?CH.filter(function(c){return c.id===cid}):CH;
 if(!cid)seq.push({card:'intro'});
 list.forEach(function(c){var i=CH.indexOf(c);seq.push({card:'ch',c:c,i:i});ST.filter(function(s){return s.ch===c.id}).forEach(function(s,k,arr){seq.push({s:s,c:c,k:k,n:arr.length})})});
 seq.push({card:cid?'endch':'end',c:list[list.length-1]});pos=0;show()}
function show(){clearTimeout(timer);var it=seq[pos];if(!it)return;
 var card=$('card');
 if(it.card){card.classList.add('on');$('ring').classList.remove('on');
   if(it.card==='intro'){$('cN').textContent='RASL ESTATE GLOBAL';$('cH').textContent=u('intro');$('cP').textContent=u('introP')}
   else if(it.card==='ch'){$('cN').textContent=u('part')+' '+(it.i+1)+' '+u('of')+' '+CH.length;$('cH').textContent=it.c[LANG];$('cP').textContent=ST.filter(function(s){return s.ch===it.c.id}).length+' '+u('steps')}
   else{$('cN').textContent=it.card==='endch'?u('end')+' · '+it.c[LANG]:'RASL ESTATE GLOBAL';$('cH').textContent=it.card==='endch'?'✓':u('endAll');$('cP').textContent=''}
   dur=it.card==='ch'?3200:3000;}
 else{card.classList.remove('on');var s=it.s;$('chT').textContent=it.c[LANG]+' · '+(it.k+1)+'/'+it.n;
   var cap=$('cap');cap.classList.remove('in');void cap.offsetWidth;cap.textContent=s[LANG]||s.en;cap.classList.add('in');
   var dots=$('dots');dots.innerHTML='';for(var i=0;i<it.n;i++){var b=document.createElement('b');if(i===it.k)b.className='on';dots.appendChild(b)}
   var shot=$('shot'),img=$('img');shot.classList.remove('in');shot.style.transition='none';shot.style.transform='scale(1)';
   img.src=s.img;void shot.offsetWidth;shot.classList.add('in');
   var ring=$('ring'),tap=$('tap');ring.classList.remove('on');tap.classList.remove('go');
   var bx=s.box;if(bx&&bx[2]>0&&bx[3]>0){var pad=.012;var x=Math.max(0,bx[0]-pad),y=Math.max(0,bx[1]-pad*.5),w=Math.min(1-x,bx[2]+pad*2),h=Math.min(1-y,bx[3]+pad);
     ring.style.left=x*100+'%';ring.style.top=y*100+'%';ring.style.width=w*100+'%';ring.style.height=h*100+'%';
     shot.style.transformOrigin=((x+w/2)*100)+'% '+((y+h/2)*100)+'%';
     setTimeout(function(){ring.classList.add('on')},650);setTimeout(function(){tap.style.left=(x+w/2)*100+'%';tap.style.top=(y+h/2)*100+'%';tap.classList.add('go')},1300)}
   else shot.style.transformOrigin='50% 40%';
   setTimeout(function(){shot.style.transition='transform 7s ease-out';shot.style.transform='scale('+(bx?1.06:1.03)+')'},700);
   var len=(s[LANG]||'').length;dur=Math.max(5200,Math.min(11000,2200+len*(LANG==='ku'?62:55)));}
 t0=performance.now();if(playing)timer=setTimeout(next,dur);bar()}
function bar(){cancelAnimationFrame(raf);var total=seq.length;(function f(){var p=(pos+(playing?Math.min(1,(performance.now()-t0)/dur):0))/total;$('bar').style.width=(p*100)+'%';if(playing)raf=requestAnimationFrame(f)})()}
function next(){if(pos<seq.length-1){pos++;show()}else{playing=false;upd();window.__done=true}}
function prev(){if(pos>0){pos--;show()}}
function upd(){$('bPlay').textContent=playing?'⏸':'▶'}
$('bPlay').onclick=function(){playing=!playing;upd();if(playing){if(pos>=seq.length-1){pos=0}show()}else{clearTimeout(timer);bar()}};
$('bNext').onclick=next;$('bPrev').onclick=prev;
$('bMenu').onclick=function(){build();$('menu').classList.remove('hide')};$('menu').onclick=function(e){if(e.target.id==='menu')$('menu').classList.add('hide')};
$('bLang').onclick=function(){LANG=LANG==='ku'?'en':'ku';setDir();build();show()};
addEventListener('keydown',function(e){if(e.key==='ArrowRight')(document.documentElement.dir==='rtl'?prev:next)();if(e.key==='ArrowLeft')(document.documentElement.dir==='rtl'?next:prev)();if(e.key===' ')$('bPlay').click()});
var sx=null;addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});addEventListener('touchend',function(e){if(sx==null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>60){var fwd=document.documentElement.dir==='rtl'?dx>0:dx<0;(fwd?next:prev)()}},{passive:true});
upd();
})();
</script>
</body>
</html>
