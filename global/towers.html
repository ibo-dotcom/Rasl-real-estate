/* ---------- unit sheet ---------- */
function split(price,pct){var c=price*pct/100,p=c*Number(CFG.pool_pct)/100,mine=p*Number(CFG.seller_pct)/100;var h='<div class="split"><span class="lab">'+esc(t('split'))+'</span>';
 var ln=function(k,v,me){return '<div class="ln'+(me?' me':'')+'"><span>'+esc(k)+'</span><b>'+v+'</b></div>'};
 h+=ln(t('comm')+' ('+num(pct)+'%)',money(c))+ln(t('pool')+' ('+num(CFG.pool_pct)+'%)',money(p))+ln(t('you')+' ('+num(CFG.seller_pct)+'%)',money(mine),1);
 LV.forEach(function(x,i){if(x>0)h+=ln(t('lvl').replace('{n}',i+1)+' ('+num(x)+'%)',money(p*x/100))});return h+'</div>'}
function uLabel(u){return t('bld')+' '+u.building+' · '+t('floor')+' '+u.floor+' · '+u.code}
function openUnit(m){sel=m;var u=m.userData.u,k=stOf(u),c=COL[k];selBox.visible=true;selBox.position.copy(m.getWorldPosition(new THREE.Vector3()));selBox.quaternion.copy(m.parent.quaternion);
 orbit.goal={tx:selBox.position.x,ty:selBox.position.y,tz:selBox.position.z,r:Math.min(orbit.r,55)};
 $('uT').textContent=uLabel(u);var b=$('uB');b.textContent=t(k);b.style.borderColor=c[2];b.style.background=c[1];b.style.color=c[3];
 $('uF').innerHTML='<div><span>'+esc(t('price'))+'</span><b style="color:#d4b06a">'+money(u.price)+'</b></div>'+(u.rooms?'<div><span>'+esc(t('rooms'))+'</span><b>'+num(u.rooms)+'</b></div>':'')+(u.area?'<div><span>'+esc(t('area'))+'</span><b>'+num(u.area)+' m²</b></div>':'');
 $('um').textContent='';var pct=L.commission_pct!=null?Number(L.commission_pct):Number(CFG.default_commission_pct);
 var body='';if(k==='free'&&Number(u.price)>0)body=split(Number(u.price),pct)+'<div class="note">'+esc(t('note'))+'</div><div class="btns"><button class="buy" data-k="sale">🏠 '+esc(t('buy'))+'</button><button class="res" data-k="reserve">📌 '+esc(t('res'))+'</button></div>';
 else if(k==='free')body='<div class="note">'+esc(t('noprice'))+'</div>';else body='<div class="note" style="font-size:14px;color:#f4efe6">'+esc(t(k==='sold'?'isS':'isR'))+'</div>';
 $('uBody').innerHTML=body;[].forEach.call($('uBody').querySelectorAll('[data-k]'),function(bt){bt.onclick=function(){deal(u,bt.dataset.k,bt)}});$('sheet').classList.add('open')}
function closeSheet(){$('sheet').classList.remove('open');if(selBox)selBox.visible=false;sel=null}
$('uX').onclick=closeSheet;
async function deal(u,k,bt){var um=$('um');[].forEach.call($('uBody').querySelectorAll('button'),function(b){b.disabled=true});um.style.color='#d4b06a';um.textContent=t('wait');
 try{var r=await SB.from('sales').insert({title:L.title+' · '+uLabel(u),amount:Number(u.price),listing_id:L.id,deal:k,unit:uLabel(u),unit_id:u.id});if(r.error)throw r.error;
   STATE[u.id]={unit_id:u.id,state:k==='sale'?'sold':'reserved',mine:true};applyFilter();legend();var m=sel;if(m){m.material=unitMat(stOf(u));pulse=1}
   openUnit(m);var um2=$('um');um2.style.color='#7fd1a0';um2.textContent=t(k==='sale'?'sentS':'sentR')}
 catch(e){var taken=/unit_taken/.test((e&&e.message)||'');um.style.color='#ff9b8a';um.textContent=t(taken?'taken':'err');if(taken){var s=await SB.rpc('unit_states',{p_listing:L.id});STATE={};(s.data||[]).forEach(function(x){STATE[x.unit_id]=x});applyFilter();legend()}else [].forEach.call($('uBody').querySelectorAll('button'),function(b){b.disabled=false})}}

/* ---------- loop ---------- */
var last=performance.now(),pulse=0;
function loop(now){requestAnimationFrame(loop);var dt=Math.min(.05,(now-last)/1000);last=now;
 if(!sel&&now-lastUser>4000)orbit.th+=dt*.06;
 if(orbit.goal){var g=orbit.goal,k=Math.min(1,dt*3);orbit.tx+=(g.tx-orbit.tx)*k;orbit.ty+=(g.ty-orbit.ty)*k;orbit.tz+=(g.tz-orbit.tz)*k;orbit.r+=(g.r-orbit.r)*k;if(Math.abs(g.r-orbit.r)<.2&&Math.abs(g.ty-orbit.ty)<.1)orbit.goal=null}
 var o=orbit;camera.position.set(o.tx+Math.sin(o.th)*Math.cos(o.el)*o.r,o.ty+Math.sin(o.el)*o.r,o.tz+Math.cos(o.th)*Math.cos(o.el)*o.r);if(camera.position.y<2)camera.position.y=2;camera.lookAt(o.tx,o.ty,o.tz);
 if(selBox&&selBox.visible){var s=1+Math.sin(now*.008)*.03;selBox.scale.set(s,s,s)}
 renderer.render(scene,camera)}
requestAnimationFrame(loop);
load().catch(function(e){console.error(e);fail(t('err'))});
window.__towers={get units(){return UNITS},pick:pick,camera:camera,orbit:orbit,openUnit:function(id){var m=PICK.filter(function(x){return x.userData.u.id===id})[0];if(m)openUnit(m)}};
})();
</script>
</body>
</html>
