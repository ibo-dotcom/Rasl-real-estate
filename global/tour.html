<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>VANA · 3D</title>
<style>
:root{--bg:#0D2136;--card:rgba(12,19,33,.86);--line:rgba(255,255,255,.12);--ink:#FFFFFF;--mute:#A9BACB;--gold:#FFFFFF;--gold2:#C9D6E3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}
#top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(rgba(11,18,32,.75),rgba(11,18,32,0));pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
#top .ttl{flex:1;min-width:0}
#top .ttl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .ttl span{font-size:12px;color:var(--gold2)}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px;flex:none;text-decoration:none;color:var(--ink)}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:6px;padding:6px;border-radius:18px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5;max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
#bar button{border:0;background:transparent;border-radius:13px;padding:7px 9px;min-width:54px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);white-space:nowrap}
#bar button i{font-style:normal;font-size:19px;line-height:1.1;color:var(--ink)}
#bar button.on{background:rgba(255,255,255,.16);color:var(--gold2)}
#bar button.gold{background:var(--gold);color:#102B46}
#bar button.gold i{color:#102B46}
#lightP{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:min(360px,calc(100% - 32px));padding:14px 16px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line);z-index:5}
#lightP input{width:100%;accent-color:var(--gold)}
#lightP .lb{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:4px;direction:ltr}
#lightP .lb span{cursor:pointer}
#floors{position:fixed;right:14px;top:calc(64px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;z-index:5}
#floors button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:13px}
#floors button.on{border-color:var(--gold);color:var(--gold2)}
#label{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-8px);opacity:0;transition:.5s;z-index:4;min-width:220px;max-width:calc(100% - 32px);padding:14px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center;pointer-events:none}
#label.show{opacity:1;transform:translate(-50%,0)}
#label b{display:block;font-size:19px;margin-bottom:3px}
#label .sz{color:var(--gold2);font-size:13px;direction:ltr;unicode-bidi:isolate}
#label p{margin:6px 0 0;font-size:14px;color:var(--ink);opacity:.9}
#hint{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;color:var(--ink);background:rgba(0,0,0,.45);padding:7px 12px;border-radius:20px;z-index:4;transition:opacity .8s;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);z-index:4;pointer-events:none;transform:translate(-50%,-50%)}
#joy b{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.75)}
#welcome{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;padding:20px 16px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(rgba(11,18,32,.15),rgba(11,18,32,.55) 45%,rgba(11,18,32,.96));transition:opacity .7s}
#welcome.out{opacity:0;pointer-events:none}
#welcome .wc{width:min(440px,100%)}
#welcome .brand{font-weight:800;letter-spacing:.32em;color:var(--gold);font-size:13px}
#welcome h1{margin:8px 0 4px;font-size:30px;line-height:1.15}
#welcome .unit{color:var(--ink);opacity:.85;font-size:15px}
#welcome .addr{color:var(--mute);font-size:14px;margin-top:2px}
#welcome .facts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
#welcome .facts div{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--mute)}
#welcome .facts b{display:block;color:var(--ink);font-size:16px;direction:ltr;unicode-bidi:isolate}
#welcome .facts .pr b{color:var(--gold2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:15px;border:1px solid var(--gold);background:transparent;color:var(--gold2);font-weight:700;font-size:16px;margin-top:10px;text-decoration:none}
.btn.gold{background:var(--gold);color:#102B46}
.row{display:flex;gap:10px}.row .btn{flex:1}
.badge{display:inline-block;margin-top:10px;font-size:11px;color:#102B46;background:var(--gold2);border-radius:20px;padding:3px 9px}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:var(--bg);color:var(--mute);font-size:14px;transition:opacity .5s}
#sheet{position:fixed;inset:0;z-index:12;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
#sheet .sc{width:min(440px,100%);background:#102B46;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));border:1px solid var(--line)}
#sheet h3{margin:0 0 2px}
#sheet p{margin:0 0 6px;color:var(--mute);direction:ltr;unicode-bidi:isolate}
#roomsP{position:fixed;inset:0;z-index:12;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#roomsP .sc{width:min(440px,100%);max-height:70vh;overflow:auto;background:#102B46;border-radius:22px 22px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line)}
#roomsP h3{margin:0 4px 10px;font-size:16px}
#rpList button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:14px;padding:12px 14px;margin-bottom:8px;text-align:start}
#rpList b{font-size:15px}#rpList span{font-size:12px;color:var(--gold2);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:6}
[dir=rtl] #label,[dir=rtl] #welcome .wc,[dir=rtl] #sheet .sc{text-align:right}
[dir=rtl] #label{text-align:center}
</style>
</head>

function bfs(a,b){if(a===b)return [];var prev=new Map(),qq=[a];prev.set(a,null);
 while(qq.length){var r=qq.shift();if(r===b)break;DOORS.forEach(function(d){if(d.rooms.length<2||d.rooms.indexOf(r)<0)return;var o=d.rooms[0]===r?d.rooms[1]:d.rooms[0];if(!prev.has(o)){prev.set(o,{r:r,d:d});qq.push(o)}})}
 if(!prev.has(b))return null;var path=[],cur=b;while(prev.get(cur)){var p=prev.get(cur);path.unshift({d:p.d,to:cur});cur=p.r}return path}
function buildTour(){var S=[],ids=(PLAN.tour&&PLAN.tour.length?PLAN.tour:ROOMS.filter(function(r){return r.type!=='corridor'}).map(function(r){return r.id}));
 var first=roomById(ids[0])||ROOMS[0],cur=first;
 if(MAIN&&MAIN.rooms.length){var mr=MAIN.rooms[0],n=normalInto(MAIN,mr);var st=new THREE.Vector3(MAIN.x,0,MAIN.z).addScaledVector(n,ELEV>0?.45:-1.8);cur=mr;
   S.push({k:'tp',p:st,look:new THREE.Vector3(MAIN.x,0,MAIN.z).addScaledVector(n,4),fi:mr.fi});if(ELEV<=0){S.push({k:'mv',p:new THREE.Vector3(MAIN.x,0,MAIN.z).addScaledVector(n,.6)})}}
 else S.push({k:'tp',p:viewPoint(first),look:new THREE.Vector3(first.cx,0,first.cz),fi:first.fi});
 ids.forEach(function(id){var r=roomById(id);if(!r)return;
   if(r.fi!==cur.fi){S.push({k:'tp',p:viewPoint(r),look:new THREE.Vector3(r.cx,0,r.cz),fi:r.fi,fade:true});cur=r}
   else if(r!==cur){var path=bfs(cur,r);if(path)path.forEach(function(st){var d=st.d,n=normalInto(d,st.to),c=new THREE.Vector3(d.x,0,d.z);S.push({k:'mv',p:c.clone().addScaledVector(n,-.55)});S.push({k:'mv',p:c.clone()});S.push({k:'mv',p:c.clone().addScaledVector(n,.75)})});else S.push({k:'mv',p:new THREE.Vector3(r.cx,0,r.cz)});cur=r}
   S.push({k:'stop',room:r})});
 S.push({k:'end'});return S}
function startTour(){if(mode==='tour'){stopTour();return}clearRoute();showTags(false);startMusic();showCeil(true);showFloors(FLOORS.length-1);tour={steps:buildTour(),i:0};setMode('tour');hintHide()}
function stopTour(){tour=null;hideLabel();setMode('walk');syncYawFromCam()}
function tourTick(dt){var s=tour.steps[tour.i];if(!s){tour=null;return}
 if(s.k==='tp'){if(s.fade&&!s.f){s.f=1;fade(true);setTimeout(function(){s.go=1},450);return}if(s.fade&&!s.go)return;
   curFloor=s.fi;pos.set(s.p.x,eyeY(s.fi),s.p.z);yaw=Math.atan2(-(s.look.x-s.p.x),-(s.look.z-s.p.z));pitch=-.04;if(s.fade)fade(false);tour.i++}
 else if(s.k==='mv'){var dx=s.p.x-pos.x,dz=s.p.z-pos.z,d=Math.hypot(dx,dz);if(d<.04){tour.i++;return}var want=Math.atan2(-dx,-dz),diff=Math.abs(((want-yaw+Math.PI*3)%(Math.PI*2))-Math.PI);yaw=lerpAng(yaw,want,dt*5);if(diff>.5)return;var sp=Math.min(1.25,.35+d*1.6)*dt;var st=Math.min(sp,d);pos.x+=dx/d*st;pos.z+=dz/d*st;pitch+=(-.04-pitch)*dt*2}
 else if(s.k==='stop'){var r=s.room;if(!s.t){var dd=Math.hypot(r.cx-pos.x,r.cz-pos.z);if(dd>3.2&&!s.moved){s.moved=1;var k=Math.min(dd-2.4,1.6)/dd;tour.steps.splice(tour.i,0,{k:'mv',p:new THREE.Vector3(pos.x+(r.cx-pos.x)*k,0,pos.z+(r.cz-pos.z)*k)});return}
     s.t=1e-4;s.base=Math.atan2(-(r.cx-pos.x),-(r.cz-pos.z));showLabel(r)}
   s.t+=dt;yaw=lerpAng(yaw,s.base,dt*2.6);pitch+=(-.06-pitch)*dt*2;if(s.t>(s.quick?3.6:5)){if(!s.quick)hideLabel();tour.i++}}
 else if(s.k==='walkend'){tour=null;setMode('walk');setTimeout(hideLabel,2500)}
 else if(s.k==='end'){tour=null;camera.position.copy(pos);camera.rotation.set(pitch,yaw,0,'YXZ');toDoll(true)}}

/* ---------------- labels / hints ---------------- */
function showLabel(r){$('lName').textContent=L(r.name)||'';var a=r.area;$('lSize').textContent=a.toFixed(a%1?1:0)+' m² · '+Math.round(a*10.7639)+' ft²';var n=L(r.note);$('lNote').textContent=n;$('lNote').style.display=n?'':'none';$('label').classList.add('show')}
function hideLabel(){$('label').classList.remove('show')}
var hintT=0;function hint(s){var h=$('hint');h.textContent=s;h.style.opacity=1;clearTimeout(hintT);hintT=setTimeout(hintHide,4500)}
function hintHide(){$('hint').style.opacity=0}
function fade(on){$('fade').style.opacity=on?1:0}

/* ---------------- music (procedural) ---------------- */
var AC=null,master=null,musicOn=true,mTimer=0,nextT=0,bar=0;
var CH=[[48,55,59,64],[45,52,55,60],[41,48,52,57],[43,50,55,59]];
function mf(n){return 440*Math.pow(2,(n-69)/12)}
function startMusic(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0;var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;var dl=AC.createDelay(1);dl.delayTime.value=.42;var fb=AC.createGain();fb.gain.value=.32;
   master.connect(lp);lp.connect(AC.destination);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(AC.destination)}
  AC.resume();master.gain.cancelScheduledValues(AC.currentTime);master.gain.setTargetAtTime(musicOn?.55:0,AC.currentTime,.8);
  if(!mTimer){nextT=AC.currentTime+.1;mTimer=setInterval(sched,250)}}catch(e){}}
function pad(n,t0,d){[0,1].forEach(function(v){var o=AC.createOscillator(),g=AC.createGain();o.type=v?'triangle':'sine';o.frequency.value=mf(n);o.detune.value=v?7:-4;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v?.012:.03,t0+1.4);g.gain.setValueAtTime(v?.012:.03,t0+d-1.2);g.gain.linearRampToValueAtTime(0,t0+d+.6);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+.7)})}
function pluck(n,t0){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=mf(n);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.035,t0+.01);g.gain.exponentialRampToValueAtTime(.0005,t0+1.6);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+1.7)}
function sched(){if(!AC)return;while(nextT<AC.currentTime+1.2){var ch=CH[bar%4];ch.forEach(function(n){pad(n,nextT,4)});pad(ch[0]-12,nextT,4);
  for(var i=0;i<8;i++){if(i===3||i===7)continue;var n=ch[(i*2+bar)%4]+12+(i===5?12:0);pluck(n,nextT+i*.5)}nextT+=4;bar++}}
function toggleMute(){musicOn=!musicOn;$('bMute').querySelector('i').textContent=musicOn?'🔊':'🔇';if(AC){master.gain.setTargetAtTime(musicOn?.55:0,AC.currentTime,.3)}else if(musicOn)startMusic()}

/* ---------------- input ---------------- */
var keys={},ptrs=new Map(),joy=null,look=null,pinch=0,tap=null;
addEventListener('keydown',function(e){keys[e.code]=true;if(mode==='tour'&&e.code==='Escape')stopTour()});addEventListener('keyup',function(e){keys[e.code]=false});
addEventListener('blur',function(){keys={}});
canvas.addEventListener('pointerdown',function(e){canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});tap={x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId};
 if(mode==='tour'&&e.pointerType!=='mouse'){}
 if(mode==='walk'&&e.pointerType==='touch'&&!joy&&e.clientX<innerWidth*.45&&e.clientY>innerHeight*.35){joy={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0};var j=$('joy');j.style.left=e.clientX+'px';j.style.top=e.clientY+'px';j.classList.remove('hide');j.firstElementChild.style.transform='';return}
 if(ptrs.size===2){var a=[...ptrs.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);look=null;return}
 look={id:e.pointerId,x:e.clientX,y:e.clientY}});
canvas.addEventListener('pointermove',function(e){if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(joy&&e.pointerId===joy.id){var dx=e.clientX-joy.x,dy=e.clientY-joy.y,m=Math.hypot(dx,dy),mx=50;if(m>mx){dx*=mx/m;dy*=mx/m}joy.dx=dx/mx;joy.dy=dy/mx;$('joy').firstElementChild.style.transform='translate('+dx+'px,'+dy+'px)';return}
 if(ptrs.size===2&&mode==='doll'){var a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch){orbit.r=Math.min(80,Math.max(4,orbit.r*pinch/d))}pinch=d;return}
 if(look&&e.pointerId===look.id){var mx2=e.clientX-look.x,my=e.clientY-look.y;look.x=e.clientX;look.y=e.clientY;var k=(e.pointerType==='mouse'?.0042:.0058);
   if(mode==='walk'){yaw+=mx2*k;pitch=Math.max(-1.3,Math.min(1.3,pitch+my*k))}
   else if(mode==='doll'&&!fly){orbit.theta-=mx2*.006;orbit.el=Math.max(.25,Math.min(1.45,orbit.el+my*.005))}}});
function endPtr(e){var wasTap=tap&&tap.id===e.pointerId&&performance.now()-tap.t<300&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<8;
 ptrs.delete(e.pointerId);if(joy&&e.pointerId===joy.id){joy=null;$('joy').classList.add('hide')}if(look&&look.id===e.pointerId)look=null;if(ptrs.size<2)pinch=0;
 if(wasTap&&mode==='doll'&&!fly){var rc=new THREE.Raycaster(),v=new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);rc.setFromCamera(v,camera);var hs=rc.intersectObjects(FLOORMESH.filter(function(f){return f.parent.visible}),false);if(hs.length){toWalk(hs[0].object.userData.room)}}}
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',function(e){if(mode==='doll'){e.preventDefault();orbit.r=Math.min(80,Math.max(4,orbit.r*(1+e.deltaY*.0012)))}},{passive:false});

function collide(x,z){var r=.24;for(var i=0;i<WALLS.length;i++){var w=WALLS[i];if(w.fi!==curFloor)continue;if(x+r>w.x0&&x-r<w.x1&&z+r>w.z0&&z-r<w.z1)return true}return false}
function walkTick(dt){var f=0,s=0;if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;if(keys.KeyA)s-=1;if(keys.KeyD)s+=1;if(keys.ArrowLeft)yaw+=dt*1.8;if(keys.ArrowRight)yaw-=dt*1.8;
 if(joy){f+=-joy.dy;s+=joy.dx}var m=Math.hypot(f,s);if(m>1){f/=m;s/=m}var sp=(keys.ShiftLeft?3.4:2.0)*dt;
 var dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp;if(!collide(pos.x+dx,pos.z))pos.x+=dx;if(!collide(pos.x,pos.z+dz))pos.z+=dz;pos.y=eyeY(curFloor)}

/* ---------------- loop ---------------- */
var last=performance.now();
function loop(now){requestAnimationFrame(loop);var dt=Math.min(.05,(now-last)/1000);last=now;
 arrowTex.offset.y-=dt*.9;if(pin){pin.position.y=pin.userData.y+.15+Math.sin(now*.004)*.08;pin.rotation.y+=dt*1.5}
 if(styleAnim){styleAnim.t=Math.min(1,styleAnim.t+dt/0.7);var e=sstep(0,1,styleAnim.t);Object.keys(styleAnim.to).forEach(function(k){M[k].color.copy(styleAnim.from[k]).lerp(styleAnim.to[k],e)});if(styleAnim.t>=1)styleAnim=null}
 if(fly){fly.t+=dt/fly.dur;var k=sstep(0,1,fly.t);camera.position.lerpVectors(fly.p0,fly.p1,k);camera.quaternion.slerpQuaternions(fly.q0,fly.q1,k);if(fly.t>=1){var d=fly.done;fly=null;if(d)d()}}
 else if(mode==='walk'){walkTick(dt);camera.position.copy(pos);camera.rotation.set(pitch,yaw,0,'YXZ')}
 else if(mode==='tour'&&tour){tourTick(dt);camera.position.copy(pos);camera.rotation.set(pitch,yaw,0,'YXZ')}
 else if(mode==='doll'){camera.position.copy(orbitPos());camera.lookAt(orbit.tx,orbit.ty,orbit.tz)}
 else if(mode==='intro'){orbit.theta+=dt*.08;camera.position.copy(orbitPos());camera.lookAt(orbit.tx,orbit.ty,orbit.tz)}
 renderer.render(scene,camera)}

/* ---------------- UI ---------------- */
function phoneInfo(){var c=PLAN.contact||{};var ph=(QS.get('phone')||c.phone||'').replace(/[^\d+]/g,'');var nm=QS.get('agent')||L(c.name)||'VANA';return {ph:ph,nm:nm}}
function initUI(){
 var name=L(PLAN.name),price=QS.get('price')||PLAN.price||'',rooms=ROOMS.filter(function(r){return r.type==='bed'}).length,area=PLAN.area||ROOMS.reduce(function(s,r){return s+(r.bal?0:r.area)},0);
 document.title='VANA · '+name;$('tName').textContent=name;$('tPrice').textContent=price;$('wName').textContent=name;$('wUnit').textContent=L(PLAN.unit);$('wAddr').textContent=L(PLAN.address);
 if(PLAN.sample){$('wSample').textContent=t('sample');$('wSample').classList.remove('hide')}
 var facts='';if(price)facts+='<div class="pr">'+t('price')+'<b>'+esc(price)+'</b></div>';facts+='<div>'+t('area')+'<b>'+(+area).toFixed(0)+' m²</b></div>';if(rooms)facts+='<div>'+t('rooms')+'<b>'+rooms+'</b></div>';if(FLOORS.length>1)facts+='<div>'+t('floor')+'<b>'+FLOORS.length+'</b></div>';$('wFacts').innerHTML=facts;
 $('wStart').querySelector('span').textContent=t('start');$('wExplore').querySelector('span').textContent=t('explore');$('wCall').querySelector('span').textContent=t('contact');
 [['bRooms','rooms'],['bTour','tour'],['bWalk','walk'],['bDoll','doll'],['bLight','light'],['bMute','sound'],['bCall','contact']].forEach(function(p){$(p[0]).querySelector('span').textContent=t(p[1])});
 $('lbM').textContent=t('morning');$('lbS').textContent=t('sunset');$('lbN').textContent=t('night');
 var pi=phoneInfo();if(pi.ph){$('wCall').classList.remove('hide');$('bCall').classList.remove('hide');$('sName').textContent=pi.nm||name;$('sPhone').textContent=pi.ph;$('sCall').href='tel:'+pi.ph;$('sCall').querySelector('span').textContent=t('call');$('sWa').href='https://wa.me/'+pi.ph.replace(/^\+/,'')+'?text='+encodeURIComponent(name+' – '+location.href);$('sWa').querySelector('span').textContent=t('wa')}
 if(window.self!==window.top)$('backB').classList.add('hide');else if(document.referrer&&document.referrer.indexOf(location.host)>=0)$('backB').addEventListener('click',function(e){e.preventDefault();history.back()});
 if(FLOORS.length>1){var fl=$('floors');fl.classList.remove('hide');FLOORS.forEach(function(f,i){var b=document.createElement('button');b.textContent=f.name?L(f.name):t('floor')+' '+(i+1);b.onclick=function(){curFloor=i;[].forEach.call(fl.children,function(c,j){c.classList.toggle('on',j===i)});if(mode==='doll'){showFloors(i);setOrbitForFloor(i);flyTo(orbitPos(),new THREE.Vector3(orbit.tx,orbit.ty,orbit.tz),1)}else{toWalk(FLOORS[i].rooms[0])}};fl.appendChild(b)});fl.firstChild.classList.add('on')}
 function begin(){$('welcome').classList.add('out');$('top').classList.remove('hide');$('bar').classList.remove('hide')}
 $('wStart').onclick=function(){begin();startTour()};
 $('wExplore').onclick=function(){begin();toWalk()};
 $('wCall').onclick=$('bCall').onclick=function(){$('sheet').classList.remove('hide')};
 $('sheet').onclick=function(e){if(e.target.id==='sheet')$('sheet').classList.add('hide')};
 $('bTour').onclick=startTour;
 $('bWalk').onclick=function(){if(mode==='tour')stopTour();else toWalk()};
 $('bDoll').onclick=function(){tour=null;toDoll(false)};
 $('bStyle').onclick=function(){applyStyle((styleIdx+1)%STYLES.length)};
 $('bLight').onclick=function(){var p=$('lightP');p.classList.toggle('hide');$('bLight').classList.toggle('on',!p.classList.contains('hide'))};
 $('bMute').onclick=toggleMute;
 $('rpT').textContent=t('goto');var rl=$('rpList');ROOMS.filter(function(r){return r.type!=='corridor'}).forEach(function(r){var b=document.createElement('button');b.innerHTML='<b></b><span></span>';b.firstChild.textContent=L(r.name);b.lastChild.textContent=fmtM(r.w).replace(' m','')+' × '+fmtM(r.d)+' · '+r.area+' m²';b.onclick=function(){routeTo(r)};rl.appendChild(b)});
 $('bRooms').onclick=function(){$('roomsP').classList.remove('hide')};$('roomsP').onclick=function(e){if(e.target.id==='roomsP')$('roomsP').classList.add('hide')};
 var sl=$('tod');sl.value=tod*1000;sl.oninput=function(){tod=sl.value/1000;applyTime()};
 [].forEach.call(document.querySelectorAll('#lightP .lb span'),function(s){s.onclick=function(){var tg=+s.dataset.t,st=tod,t0=performance.now();(function an(){var k=Math.min(1,(performance.now()-t0)/1200);tod=st+(tg-st)*sstep(0,1,k);sl.value=tod*1000;applyTime();if(k<1)requestAnimationFrame(an)})()}});
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------------- boot ---------------- */
function boot(plan){PLAN=plan;ELEV=+plan.elevation||0;curPlanRooms=[];
 (plan.floors||[]).forEach(function(f){(f.rooms||[]).forEach(function(r){curPlanRooms.push({type:r.type,cx:r.rect[0]+r.rect[2]/2,cz:r.rect[1]+r.rect[3]/2})})});
 seed=11;(plan.floors||[]).forEach(buildFloor);
 BOUNDS={x0:Math.min.apply(null,FLOORS.map(function(f){return f.x0})),x1:Math.max.apply(null,FLOORS.map(function(f){return f.x1})),z0:Math.min.apply(null,FLOORS.map(function(f){return f.z0})),z1:Math.max.apply(null,FLOORS.map(function(f){return f.z1}))};
 buildWorld();applyStyle(styleIdx,true);applyTime();initUI();
 setOrbitForFloor(0);orbit.el=.62;orbit.r*=1.15;showCeil(false);showTags(true);
 $('loading').style.opacity=0;setTimeout(function(){$('loading').classList.add('hide')},500);$('welcome').classList.remove('hide');
 requestAnimationFrame(loop);
 if(QS.get('auto')==='walk'){$('wExplore').click()}else if(QS.get('auto')==='tour'){$('wStart').click()}
}
function fail(){$('loading').textContent=t('err')}
var pq=QS.get('plan'),pp=QS.get('p');
if(pq){try{var js=decodeURIComponent(escape(atob(pq.replace(/-/g,'+').replace(/_/g,'/'))));boot(JSON.parse(js))}catch(e){console.error(e);fail()}}
else if(pp){fetch('plans/'+encodeURIComponent(pp)+'.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(boot).catch(function(e){console.error(e);fail()})}
else boot(SAMPLE);
window.__tour={routeTo:routeTo,orbit:orbit,get busy(){return !!fly||(!!tour)},get mode(){return mode},ROOMS:ROOMS,DOORS:DOORS,setTime:function(v){tod=v;applyTime()},style:applyStyle,toDoll:toDoll,toWalk:toWalk,startTour:startTour,get tour(){return tour},camera:camera};
})();
