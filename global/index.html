<style>
html,body{height:100%;margin:0;background:#F5F8FB;overscroll-behavior:none}
#app{height:100vh;height:100dvh;max-width:600px;margin:0 auto;box-sizing:border-box;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:#F5F8FB}
/* The host adds its own badge. It sits at the very end of the page, under the app, instead of floating over it.
   If the host ever pins it again, the app ends above it so it never covers a button. */
#nl-badge-frame{position:static!important;display:block!important;margin:0 0 0 auto!important}
body.nl-fixed #app{height:calc(100vh - 54px);height:calc(100dvh - 54px)}
.desk-side{display:none;position:fixed;top:50%;transform:translateY(-50%);flex-direction:column;align-items:center;gap:10px;color:#718096;font:500 13px Inter,'Noto Sans Arabic',system-ui,sans-serif;pointer-events:none;text-align:center;max-width:220px}
/* Desktop / laptop: the app sits in a phone-like frame in the middle, rows can be dragged with the mouse */
@media (min-width: 700px){
 html,body{background:#EAF1F7}
 #app{max-width:640px;box-shadow:0 30px 80px rgba(16,43,70,.16),0 0 0 1px #EAF1F7;border-radius:0}
 .tm-sheet{background:rgba(16,43,70,.55)}
 .tm-panel{max-width:640px}
 #app ::-webkit-scrollbar{width:8px;height:0}
 #app ::-webkit-scrollbar-thumb{background:#DFE7EF;border-radius: 4px}
 #app [style*="overflow-x: auto"],#app .cz-track{cursor:grab}
 #app .dragging,#app .dragging *{cursor:grabbing!important;user-select:none}
 .desk-side{display:flex}
}
@media (min-width: 1100px){#app{max-width:560px}.tm-panel{max-width:560px}}
.desk-side b{color:#173F63;letter-spacing:.24em;font-size:15px}
.desk-side i{font-style:normal;width:64px;height:64px;border:1px solid #173F63;border-radius:50%;display:grid;place-items:center;font:600 34px 'Cormorant Garamond',Georgia,serif;color:#173F63}
@media (max-width: 1099px){.desk-side{display:none!important}}
/* Compact bottom bar */
nav[aria-label="Main"]{height:58px!important}
nav[aria-label="Main"] a{gap:2px!important;font-size:10px!important;font-weight:500!important}
nav[aria-label="Main"] svg{width:19px;height:19px}
.pj-panel>*{flex-shrink:0}
/* Slideshows (ads, projects) */
.cz{position:relative;flex-shrink:0;margin:0 -20px}
.cz-track{direction:ltr;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.cz-track::-webkit-scrollbar{display:none}
.cz-slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;padding:0 20px;box-sizing:border-box}
[dir=rtl] .cz-slide{direction:rtl}
.cz-dots{display:flex;justify-content:center;gap:2px;margin-top:0;direction:ltr}
.cz-dot{position:relative;width:22px;height:18px;border:0;padding:0;background:transparent;cursor:pointer}
.cz-dot::before{content:"";position:absolute;top:50%;left:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius: 4px;background:#C9D6E3;transition:width .3s,margin .3s,background .3s}
.cz-dot.on::before{width:18px;margin-left:-9px;background:#173F63}
.crm-b{height:38px;padding:0 12px;border-radius: 8px;border:1px solid #DFE7EF;background:#FFFFFF;color:#172B3A;font:600 12px Inter,'Noto Sans Arabic',system-ui,sans-serif;cursor:pointer;flex-shrink:0}
.crm-b.gold{background:#173F63;border-color:#173F63;color:#FFFFFF}
/* World map */
.mapslot{position:relative;height:56vh;min-height:300px;border-radius: 10px;overflow:hidden;border:1px solid #DFE7EF;background:#EAF1F7;flex-shrink:0}
.mapslot>.mapbox{position:absolute!important;inset:0;width:100%;height:100%}
.mapinfo:empty{display:none}
.mapinfo{padding:14px;background:#FFFFFF;border:1px solid #DFE7EF;border-radius: 12px;display:flex;flex-direction:column;gap:10px}
.mi-t{margin:0;font-size:14px;color:#3D5166}
.mi-row{display:flex;gap:12px;align-items:center}
.mi-name{display:block;font-size:16px;overflow-wrap:anywhere}
.mi-sub{display:block;font-size:12px;color:#718096;margin-top:3px;overflow-wrap:anywhere}
.mi-big{font-size:16px;color:#173F63}
.mi-acts{display:flex;gap:8px;flex-wrap:wrap}
.mi-btn{flex:1;min-width:120px;height:46px;border-radius: 8px;border:1px solid #DFE7EF;background:transparent;color:#172B3A;font:600 14px Inter,'Noto Sans Arabic',system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.mi-btn.gold{background:#173F63;border-color:#173F63;color:#FFFFFF}
.mi-seg{height:36px;padding:0 14px;border-radius: 10px;border:1px solid #DFE7EF;background:transparent;color:#718096;font:500 13px Inter,'Noto Sans Arabic',system-ui,sans-serif;cursor:pointer}
.mi-seg.on{border-color:#173F63;color:#173F63}
.gpin{padding:5px 9px;border:2px solid #F5F8FB;border-radius: 6px;background:#173F63;color:#FFFFFF;font:700 12px Inter,system-ui,sans-serif;white-space:nowrap;box-shadow:0 2px 8px rgba(16,43,70,.15);cursor:pointer;direction:ltr;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.gpin.on{background:#172B3A;outline:3px solid #173F63}
.gme{width:18px;height:18px;border-radius:50%;background:#2F6FD0;border:3px solid #fff;box-shadow:0 0 0 9px rgba(47,111,208,.25),0 2px 6px rgba(16,43,70,.06)}
.gspot{display:flex;flex-direction:column-reverse;align-items:center;gap:4px;pointer-events:none}
.gspot i{width:18px;height:18px;border-radius:50%;background:#E5484D;border:3px solid #fff;box-shadow:0 2px 8px rgba(16,43,70,.06)}
.gspot span{max-width:200px;padding:3px 8px;border-radius: 4px;background:#fff;color:#F5F8FB;font:600 12px Inter,system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Team map: people drawn under their sponsor, joined by lines. */
.tm-wrap{direction:ltr;overflow:auto;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:4px 20px 12px;flex-shrink:0;max-height:62vh}
.tm,.tm ul{list-style:none;margin:0;padding:0;display:flex;justify-content:center}
.tm{min-width:max-content}
.tm ul{padding-top:22px;position:relative}
.tm li{position:relative;padding:22px 6px 0;display:flex;flex-direction:column;align-items:center}
.tm>li{padding-top:0}
.tm li::before,.tm li::after{content:"";position:absolute;top:0;width:50%;height:22px;border-top:2px solid #C9D6E3}
.tm li::before{right:50%}.tm li::after{left:50%;border-left:2px solid #C9D6E3}
.tm li:only-child::before,.tm li:only-child::after{border-top:0}
.tm li:only-child::after{left:50%}
.tm li:first-child::before,.tm li:last-child::after{border-top:0}
.tm li:last-child::before{border-right:2px solid #C9D6E3;border-top-right-radius:8px}
.tm li:first-child::after{border-top-left-radius:8px}
.tm>li::before,.tm>li::after{display:none}
.tm ul::before{content:"";position:absolute;top:0;left:50%;height:22px;border-left:2px solid #C9D6E3}
.tm-card{width:118px;padding:10px 8px;border-radius: 12px;border:1px solid #DFE7EF;background:#FFFFFF;color:#172B3A;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font:inherit;text-align:center}
.tm-card.me{border-color:#173F63}
.tm-face{width:44px;height:44px;border-radius:50%;border:1px solid #173F63;background:#F5F8FB;color:#718096;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.tm-name{font-size:12px;font-weight:600;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tm-code{font-size:10px;color:#173F63}
.tm-rank{font-size:10px;color:#173F63}
.tm-pts{font-size:10px;color:#718096}
.tm-more{margin-top:6px;min-width:44px;height:30px;padding:0 10px;border-radius: 15px;border:1px solid #C9D6E3;background:#FFFFFF;color:#173F63;font:600 12px Inter,'Noto Sans Arabic',system-ui,sans-serif;cursor:pointer}
.tm-sheet{position:fixed;inset:0;z-index:50;background:rgba(16,43,70,0.7);display:flex;align-items:flex-end;justify-content:center}
.tm-panel{width:100%;max-width:600px;max-height:86vh;overflow-y:auto;box-sizing:border-box;padding:20px 20px calc(20px + env(safe-area-inset-bottom));background:#FFFFFF;border:1px solid #DFE7EF;border-bottom:0;border-radius: 14px 22px 0 0;display:flex;flex-direction:column;gap:14px;outline:0}
/* Rows in a scrolling screen keep their own height; the screen scrolls instead of squeezing them. */
#app [style*="overflow-y: auto"]>*{flex-shrink:0}
#adsRow::-webkit-scrollbar{display:none}
#email{direction:ltr;text-align:left}
a{color:#718096}
button,a{-webkit-tap-highlight-color:transparent}
[dir="rtl"] *{letter-spacing:0 !important}
</style>

<style id="rasl-design">
:root{--navy:#102B46;--royal:#173F63;--white:#FFFFFF;--bg:#F5F8FB;--blue:#EAF1F7;--ink:#172B3A;--muted:#718096;--line:#DFE7EF;--gold:#B8955A}
html,body{background:#F5F8FB}
body{color:#172B3A;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
#app{background:#F5F8FB;color:#172B3A}
::selection{background:#D6E4F0;color:#102B46}
@media (min-width:700px){html,body{background:#EAF1F7!important}#app{box-shadow:0 24px 60px rgba(16,43,70,.10),0 0 0 1px #DFE7EF!important}.desk-side b{color:#102B46}.desk-side i{border-color:#102B46;color:#102B46}.desk-side{color:#718096}}
/* buttons */
#app button,#app a,#app input,#app select,#app textarea{transition:background-color .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease}
.crm-b{background:#FFFFFF;border-color:#DFE7EF;color:#173F63;font-weight:600;letter-spacing:.01em}
.crm-b:hover{border-color:#173F63;background:#F5F8FB}
.crm-b.gold{background:#173F63;border-color:#173F63;color:#FFFFFF}
.crm-b.gold:hover{background:#102B46;border-color:#102B46}
.crm-b:active,.mi-btn:active{transform:translateY(1px)}
.crm-b:disabled,#app button:disabled{opacity:.55;cursor:default}
.mi-btn.gold{background:#173F63;border-color:#173F63;color:#fff}
.mi-btn.gold:hover{background:#102B46}
#app :focus-visible{outline:2px solid #173F63;outline-offset:2px}
/* fields: clean white inputs, navy focus */
#app input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not(#homeQ),#app select,#app textarea{background-color:#FFFFFF!important;border-color:#DFE7EF!important;color:#172B3A!important}
#app input:focus,#app select:focus,#app textarea:focus{border-color:#173F63!important;box-shadow:0 0 0 3px rgba(23,63,99,.10)}
#app input::placeholder,#app textarea::placeholder{color:#9AA8B8}
#app input[type=checkbox]{accent-color:#173F63}
/* bottom navigation: quiet architectural glass */
nav[aria-label="Main"]{background:rgba(255,255,255,.92)!important;-webkit-backdrop-filter:saturate(1.3) blur(12px);backdrop-filter:saturate(1.3) blur(12px);border-top:1px solid #DFE7EF!important;box-shadow:0 -1px 0 rgba(16,43,70,.02)}
nav[aria-label="Main"] a{color:#8796A8}
/* sheets */
.tm-sheet{background:rgba(16,43,70,.28)!important;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.tm-panel{box-shadow:0 -8px 32px rgba(16,43,70,.12)!important;border-color:#DFE7EF!important}
/* text on photos stays white and readable */
[style*="linear-gradient(to top, rgba(16,43,70"],[style*="linear-gradient(to top, rgba(16,43,70"] *,[style*="linear-gradient(to top, rgba(16,43,70"]~span,[style*="linear-gradient(to top, rgba(16,43,70"]~span *{color:#FFFFFF!important}
[style*="background-image: linear-gradient(rgba(16,43,70"] span{color:#fff}
/* slideshow dots */
.cz-dot::before{background:#C9D6E3}.cz-dot.on::before{background:#173F63}
/* map: light, navy markers, white panels */
.mapslot{background:#EAF1F7;border-color:#DFE7EF}
.mapinfo{background:#FFFFFF;border-color:#DFE7EF;box-shadow:0 8px 24px rgba(16,43,70,.08)}
.gpin{background:#173F63;color:#FFFFFF;border:2px solid #FFFFFF;border-radius:6px;box-shadow:0 2px 6px rgba(16,43,70,.25);font-weight:600}
.gpin.on{background:#FFFFFF;color:#102B46;outline:2px solid #173F63}
.gpin:hover{background:#102B46}
.gpin.on:hover{background:#FFFFFF}
.mi-seg.on{background:#173F63;border-color:#173F63;color:#fff}
.maplibregl-ctrl-group{border-radius:8px!important;box-shadow:0 2px 8px rgba(16,43,70,.12)!important}
/* scrollbars */
#app ::-webkit-scrollbar-thumb{background:#C9D6E3}
/* calmer motion */
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
</style>

<style id="rasl-responsive">
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
#app input,#app select,#app textarea{font-size:16px!important}
.tm-panel{border-radius:16px 16px 0 0!important}
.ei{display:inline-flex;width:1.15em;height:1.15em;vertical-align:-.2em;flex-shrink:0}
.ei svg{width:100%!important;height:100%!important;display:block}
.edot{display:inline-block;width:.6em;height:.6em;border-radius:50%;vertical-align:.05em}
/* touch targets */
.crm-b{min-height:44px}
.cz-dot{width:32px!important;height:32px!important}
#app a[href="#Ads"],#app a[href="#Listings"],#app a[href="#Network"]{min-height:36px;display:inline-flex;align-items:center}
[data-act=toggleT]{min-height:36px!important}
[data-act=crmStage]{min-height:40px!important}

.hchip{border:1px solid #DFE7EF;background:#FFFFFF;color:#172B3A;font-family:Inter,'Noto Sans Arabic',system-ui,sans-serif;font-weight:500;cursor:pointer;flex-shrink:0;white-space:nowrap}

/* mobile header */
.mhdr a:hover,.mhdr button:hover{border-color:#173F63!important}
/* side menu */
.tm-sheet.mside{align-items:stretch!important;justify-content:flex-start!important}
.mpanel{width:min(86vw,340px)!important;max-width:340px!important;height:100%!important;max-height:none!important;border-radius:0!important;border:0!important;border-inline-end:1px solid #DFE7EF!important;padding:calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))!important;gap:16px!important;animation:mslide .22s ease-out}

.mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 8px;border-radius:8px;border:0;background:none;color:#172B3A;text-decoration:none;font:500 15px Inter,'Noto Sans Arabic',system-ui,sans-serif;cursor:pointer;text-align:start;box-sizing:border-box}
.mrow:hover{background:#F5F8FB}
.mrow>span:first-child{color:#173F63}

.mapinfo:not(:empty){position:sticky;bottom:8px;z-index:6}
.mapslot{height:min(56vh,520px)!important}
/* never scroll sideways */
html,body{overflow-x:hidden}
#app img{max-width:100%}
@media (max-width:359px){.mhdr a[href="#Search"]{display:none!important}}
@media (min-width:700px){.tm-sheet.mside{padding-inline:max(0px,calc((100vw - 640px) / 2))}}
@media (min-width:1100px){.tm-sheet.mside{padding-inline:max(0px,calc((100vw - 560px) / 2))}}
</style>

j.sort(function(a,b){return score(b)-score(a);});return j[0];}

function nodePath(el,root){var p=[];while(el&&el!==root){var i=0,s=el;while((s=s.previousElementSibling))i++;p.unshift(i);el=el.parentElement;}return p.join('.');}

function keepBefore(root,r){var imgs={},sc=[];if(!root)return {r:r,imgs:imgs,sc:sc};
 root.querySelectorAll('img').forEach(function(im){var k=im.getAttribute('src');if(k&&im.complete&&im.naturalWidth){(imgs[k]=imgs[k]||[]).push(im);}});
 root.querySelectorAll('*').forEach(function(el){if((el.scrollTop>0||el.scrollLeft>0)&&!el.classList.contains('cz-track'))sc.push({p:nodePath(el,root),t:el.scrollTop,l:el.scrollLeft});});
 return {r:r,imgs:imgs,sc:sc};}
function keepAfter(root,k,r){if(!root||!k)return;
 root.querySelectorAll('img').forEach(function(nw){var src=nw.getAttribute('src'),pool=src&&k.imgs[src];if(!pool||!pool.length)return;var old=pool.shift();
  [].slice.call(old.attributes).forEach(function(a){if(!nw.hasAttribute(a.name))old.removeAttribute(a.name);});
  [].slice.call(nw.attributes).forEach(function(a){if(a.name!=='src'&&old.getAttribute(a.name)!==a.value)old.setAttribute(a.name,a.value);});
  if(nw.parentNode)nw.parentNode.replaceChild(old,nw);});
 if(k.r===r)k.sc.forEach(function(s){var el=nodeAt(root,s.p);if(el){el.scrollTop=s.t;el.scrollLeft=s.l;}});}

function linkCard(l,edit){if(!l.site_url&&!edit)return '';var pct=l.commission_pct!=null?Number(l.commission_pct):Number(cfg.default_commission_pct||0),pts=Math.round(Number(String(l.price||'').replace(/[^0-9.]/g,''))/1000)||'';
var h='<div class="ocard"><div class="mi-row"><span class="gico big">'+mIco('share')+'</span><div class="gtx"><b>'+esc(mt15('t'))+'</b><small style="white-space: normal">'+esc(mt15('d'))+'</small></div></div>';
if(l.site_url)h+='<p dir="ltr" class="ofp" style="font-size: 12px; overflow-wrap: anywhere">'+esc(l.site_url)+'</p><p class="ofp" style="font-size: 12px; color: #1F8A5B; font-weight: 600">'+esc(mt15('comm').replace('{p}',pct).replace('{n}',pts||'—'))+'</p><div style="display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px"><a href="'+esc(l.site_url)+'" target="_blank" rel="noopener" class="catm">'+mIco('cube')+'<span>'+esc(mt15('open'))+'</span></a><button data-act="linkShare" data-id="'+esc(l.id)+'" class="catm">'+mIco('share')+'<span>'+esc(mt15('share'))+'</span></button><button data-act="linkSell" data-id="'+esc(l.id)+'" class="catm" style="background: #173F63; border-color: #173F63; color: #FFFFFF">'+mIco('plus')+'<span style="color: #FFFFFF">'+esc(mt15('sell'))+'</span></button></div>';
if(edit)h+='<div style="display: flex; gap: 6px"><input id="pl_url" type="url" dir="ltr" inputmode="url" placeholder="'+esc(mt15('add'))+'" value="'+esc(l.site_url||'')+'" style="'+INP+'; flex: 1; min-width: 0; height: 44px"><button data-act="linkSave" data-id="'+esc(l.id)+'" class="crm-b gold" style="height: 44px; white-space: nowrap">'+esc(mt15('save'))+'</button></div><div id="plmsg" class="ofmsg" role="status"></div>';
return h+'</div>';}

// Owner's private notebook: only the owner can read or write it (RLS owner_notes_all).
function notesOpen(){var N=window.__notes||(window.__notes={list:[]});loadNotes();noteSheet();}
async function loadNotes(){var N=window.__notes||(window.__notes={list:[]});if(!SB||!me||me.role!=='owner')return;try{var r=await SB.from('owner_notes').select('*').order('created_at',{ascending:false});N.list=r.data||[];}catch(e){N.list=[];}noteSheet();}
function noteSheet(){var N=window.__notes||{list:[]},o=document.getElementById('noteView');if(!o){o=document.createElement('div');o.id='noteView';o.className='secov';document.body.appendChild(o);}
 var rows=N.list.map(function(n){return '<div class="secrow"><span style="white-space:pre-wrap;'+(n.done?'text-decoration:line-through;opacity:.6':'')+'">'+esc(n.body)+'</span><small dir="ltr">'+esc(new Date(n.created_at).toLocaleString('en-GB'))+'</small><div class="secacts"><button data-nt="toggle" data-id="'+n.id+'" class="crm-b">'+(n.done?'↺':'✓')+'</button><button data-nt="del" data-id="'+n.id+'" class="crm-b" style="color:#B42318">×</button></div></div>';}).join('');
 o.innerHTML='<div class="secpage"><div class="sechead"><b>دەفتەری تایبەت</b><button data-nt="close" class="cv-x" style="position:static">×</button></div><div class="secsec"><textarea id="ntIn" rows="3" maxlength="4000" class="inp" style="height:auto;padding:10px"></textarea><button data-nt="add" class="crm-b gold" style="height:44px">زیادکردن</button></div><div class="secsec">'+(rows||'<p class="ofp">هیچ تێبینییەک نییە.</p>')+'</div></div>';
 o.onclick=noteClick;}
async function noteClick(e){var b=e.target.closest('[data-nt]');if(!b)return;var k=b.getAttribute('data-nt'),N=window.__notes;
 if(k==='close'){document.getElementById('noteView').remove();return;}
 try{if(k==='add'){var t=(document.getElementById('ntIn').value||'').trim();if(!t)return;var r=await SB.from('owner_notes').insert({body:t});if(r.error)throw r.error;}
 if(k==='toggle'){var n=N.list.find(function(x){return x.id===b.dataset.id});await SB.from('owner_notes').update({done:!n.done}).eq('id',b.dataset.id);}
 if(k==='del'){await SB.from('owner_notes').delete().eq('id',b.dataset.id);}}catch(x){alert(errText(x));}
 loadNotes();}
