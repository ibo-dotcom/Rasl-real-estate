<style>
html,body{height:100%;margin:0;background:#0B1220;overscroll-behavior:none}
#app{height:100vh;height:100dvh;max-width:480px;margin:0 auto;box-sizing:border-box;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:#0B1220}
/* The host adds its own badge. It sits at the very end of the page, under the app, instead of floating over it.
   If the host ever pins it again, the app ends above it so it never covers a button. */
#nl-badge-frame{position:static!important;display:block!important;margin:0 0 0 auto!important}
body.nl-fixed #app{height:calc(100vh - 54px);height:calc(100dvh - 54px)}
/* Team map: people drawn under their sponsor, joined by lines. */
.tm-wrap{direction:ltr;overflow:auto;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:4px 20px 12px;flex-shrink:0;max-height:62vh}
.tm,.tm ul{list-style:none;margin:0;padding:0;display:flex;justify-content:center}
.tm{min-width:max-content}
.tm ul{padding-top:22px;position:relative}
.tm li{position:relative;padding:22px 6px 0;display:flex;flex-direction:column;align-items:center}
.tm>li{padding-top:0}
.tm li::before,.tm li::after{content:"";position:absolute;top:0;width:50%;height:22px;border-top:2px solid #2C3A5A}
.tm li::before{right:50%}.tm li::after{left:50%;border-left:2px solid #2C3A5A}
.tm li:only-child::before,.tm li:only-child::after{border-top:0}
.tm li:only-child::after{left:50%}
.tm li:first-child::before,.tm li:last-child::after{border-top:0}
.tm li:last-child::before{border-right:2px solid #2C3A5A;border-top-right-radius:8px}
.tm li:first-child::after{border-top-left-radius:8px}
.tm>li::before,.tm>li::after{display:none}
.tm ul::before{content:"";position:absolute;top:0;left:50%;height:22px;border-left:2px solid #2C3A5A}
.tm-card{width:118px;padding:10px 8px;border-radius:16px;border:1px solid #24304A;background:#131C2E;color:#F2EEE6;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font:inherit;text-align:center}
.tm-card.me{border-color:#D4B06A}
.tm-face{width:44px;height:44px;border-radius:50%;border:1px solid #D4B06A;background:#0B1220;color:#9AA6BD;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.tm-name{font-size:12px;font-weight:600;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tm-code{font-size:10px;color:#D4B06A}
.tm-rank{font-size:10px;color:#A9C8FF}
.tm-pts{font-size:10px;color:#9AA6BD}
.tm-more{margin-top:6px;min-width:44px;height:30px;padding:0 10px;border-radius:15px;border:1px solid #2C3A5A;background:#0E1626;color:#A9C8FF;font:600 12px Inter,'Noto Sans Arabic',system-ui,sans-serif;cursor:pointer}
.tm-sheet{position:fixed;inset:0;z-index:50;background:rgba(4,7,14,0.7);display:flex;align-items:flex-end;justify-content:center}
.tm-panel{width:100%;max-width:480px;max-height:86vh;overflow-y:auto;box-sizing:border-box;padding:20px 20px calc(20px + env(safe-area-inset-bottom));background:#0E1626;border:1px solid #24304A;border-bottom:0;border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:14px;outline:0}
/* Rows in a scrolling screen keep their own height; the screen scrolls instead of squeezing them. */
#app [style*="overflow-y: auto"]>*{flex-shrink:0}
#adsRow::-webkit-scrollbar{display:none}
a{color:#9AA6BD}
button,a{-webkit-tap-highlight-color:transparent}
[dir="rtl"] *{letter-spacing:0 !important}
</style>

clearTimeout(codeTimer);if(ownerMode){var u=v.trim().toUpperCase();showSponsor(u&&!OWNRE.test(u)?T('m_owncode_bad'):T('m_owncode'),!u||OWNRE.test(u));return;}showSponsor('',true);if(!SB||!v.trim())return;
codeTimer=setTimeout(async function(){try{var r=await SB.rpc('check_code',{p_code:v});if(r.error)return;if(r.data===null)showSponsor(T('m_code_bad'),false);else showSponsor(T('m_sponsor')+': '+(r.data||'—'),true);}catch(e){}},450);
}
var ownerState=null,LIVE=(/^https?:$/.test(location.protocol)&&!/claude|localhost|127\.0\.0\.1/.test(location.hostname))?location.origin+location.pathname.replace(/\/[^\/]*$/,''):'https://rasl-global.netlify.app';
async function checkOwner(){if(!SB){ownerState='off';}else{try{var r=await SB.rpc('needs_owner');ownerState=r.error?'off':(r.data===true);}catch(e){ownerState='off';}}if(route()==='Welcome')render();}
function welcomeState(){
var a=app.querySelector('a[href="#Register"]'),p=a&&a.previousElementSibling;if(!a||!p)return;
if(ownerState===true){p.textContent=T('w_owner');a.textContent=T('w_owner_cta');}
else if(ownerState==='off'&&location.origin!==LIVE){p.textContent=T('w_off')+' ';var l=document.createElement('a');l.href=LIVE;l.target='_blank';l.rel='noopener';l.textContent=LIVE.replace(/^https?:\/\//,'');l.style.cssText='color: #D4B06A; font-weight: 600; direction: ltr; unicode-bidi: isolate';p.appendChild(l);}
}
var ownerMode=false,OWNRE=/^[A-Z0-9][A-Z0-9-]{1,14}[A-Z0-9]$/;
async function initRegister(){ownerMode=false;if(!SB){showSponsor(T('m_offline'),false);return;}try{var r=await SB.rpc('needs_owner');if(r.error){if(route()==='Register')showSponsor(T('m_offline'),false);return;}if(r.data===true&&route()==='Register'){ownerMode=true;var l=$('codelabel'),c=$('code');if(l)l.textContent=T('owncode');if(c){c.placeholder='RASL-1';c.style.textTransform='uppercase';}showSponsor(T('m_owncode'),true);}}catch(e){if(route()==='Register')showSponsor(T('m_offline'),false);}}
var actions={
signup:async function(){
if(!SB){msg(T('m_offline'));return;}
var code=val('code'),name=val('name'),email=val('email'),pass=$('pass')?$('pass').value:'';
if(!name||!email||pass.length<6){msg(T('m_fields'));return;}
if(pass!==($('pass2')?$('pass2').value:'')){msg(T('m_pass2'));return;}
msg(T('m_wait'),true);
try{
var need=await SB.rpc('needs_owner');if(need.error)throw need.error;
var own='';
if(need.data===true){own=code.toUpperCase();if(!own){msg(T('m_owncode_need'));return;}if(!OWNRE.test(own)){msg(T('m_owncode_bad'));return;}code='';}
if(need.data!==true){if(!code){msg(T('m_code_need'));return;}var c=await SB.rpc('check_code',{p_code:code});if(c.error)throw c.error;if(c.data===null){msg(T('m_code_bad'));return;}}
var r=await SB.auth.signUp({email:email,password:pass,options:{emailRedirectTo:LIVE+'/',data:{sponsor_code:code,own_code:own,full_name:name,phone:val('phone'),country:val('country')}}});
if(r.error){msg(r.error.message);return;}
put('reg_email',email);
if(r.data&&r.data.session){await loadMe();location.hash='#Main';}
else if(r.data&&r.data.user&&r.data.user.identities&&r.data.user.identities.length===0){st.loginMsg='m_exists';location.hash='#Login';}
else{st.loginMsg='m_sent';location.hash='#Login';}
}catch(e){msg(T('m_offline'));}
},
signin:async function(){
if(!SB){msg(T('m_offline'));return;}
var email=val('email'),pass=$('pass')?$('pass').value:'';if(!email||!pass){msg(T('m_login'));return;}
msg(T('m_wait'),true);
try{var r=await SB.auth.signInWithPassword({email:email,password:pass});if(r.error){var em=String(r.error.message||'').toLowerCase();msg(T(em.indexOf('confirm')>=0?'m_unconfirmed':em.indexOf('invalid')>=0?'m_badlogin':'m_offline'));return;}put('reg_email',email);await loadMe();location.hash='#Main';}catch(e){msg(T('m_offline'));}
},
signout:async function(){try{if(SB)await SB.auth.signOut();}catch(e){}me=null;team=[];location.hash='#Welcome';render();},
saveProfile:async function(a){
if(!SB||!me){msg(T('m_offline'));return;}
var name=val('pf_name'),code=me.code||'';
if(name.length<2){msg(T('p_name_need'));return;}
a.disabled=true;msg(T('m_wait'),true);
try{
if(pf.blob){pf.done=await putPhoto('avatars',me.id+'/'+Date.now()+'.jpg',pf.blob);pf.blob=null;}
var url=pf.done||me.avatar_url||'';
var r=await SB.rpc('save_my_profile',{p_full_name:name,p_last_name:val('pf_last'),p_phone:val('pf_phone'),p_country:val('pf_country'),p_city:val('pf_city'),p_avatar_url:url,p_code:code});
if(r.error){var e=String(r.error.message||'');msg(T(e.indexOf('code_taken')>=0?'p_code_taken':e.indexOf('code_format')>=0?'m_owncode_bad':e.indexOf('name_required')>=0?'p_name_need':'p_err'));a.disabled=false;return;}
me=Array.isArray(r.data)?r.data[0]:r.data;pf={blob:null,url:''};render();msg(T('p_saved'),true);
}catch(e){msg(T('p_err'));a.disabled=false;}
},
addAd:async function(a){
if(!SB||!me||me.role!=='owner')return;
var title=val('ad_title');if(!title||!adBlobs.length){msg(T('a_need'));return;}
a.disabled=true;msg(T('m_wait'),true);
try{
var place=val('ad_place'),price=val('ad_price');
while(adBlobs.length){
var url=await putPhoto('ads',Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg',adBlobs[0]);
var r=await SB.from('ads').insert({title:title,place:place,price:price,image_url:url,position:0});
if(r.error)throw r.error;
adBlobs.shift();
}
await loadAds();render();msg(T('a_done'),true);
}catch(e){msg(T('p_err'));a.disabled=false;}
},
memberInfo:function(a){st.mid=a.getAttribute('data-id');render();var p=app.querySelector('.tm-panel');if(p)p.focus&&p.focus();},
closeSheet:function(a,e){st.mid=null;render();},
recordSale:async function(a){
if(!SB||!me)return;
var title=val('s_title'),amount=Number(String(val('s_amount')).replace(/[^0-9.]/g,''));
if(!title||!(amount>0)){msg(T('s_need'));return;}
a.disabled=true;msg(T('m_wait'),true);
try{var r=await SB.from('sales').insert({title:title,amount:amount});if(r.error)throw r.error;await loadSales();render();msg(T('s_sent'),true);}catch(e){msg(T('p_err'));a.disabled=false;}
},
decideSale:async function(a){
if(!SB||!me||me.role!=='owner')return;
a.disabled=true;
try{var r=await SB.from('sales').update({status:a.getAttribute('data-to'),decided_at:new Date().toISOString()}).eq('id',a.getAttribute('data-id'));if(r.error)throw r.error;await loadSales();await loadStats();render();}catch(e){a.disabled=false;msg(T('p_err'));}
},
toggleT:function(a){var id=a.getAttribute('data-id');openT[id]=!openT[id];render();},
openListing:function(a){st.lid=a.getAttribute('data-id');location.hash='#Listing';},
addListing:async function(a){
if(!SB||!me||me.role!=='owner')return;
var title=val('l_title');if(!title||!lBlobs.length){msg(T('l_need'));return;}
var row={title:title,place:val('l_place'),price:val('l_price'),details:val('l_details'),featured:!!($('l_feat')&&$('l_feat').checked),images:[]};
a.disabled=true;msg(T('m_wait'),true);
try{
for(var k=0;k<lBlobs.length;k++){row.images.push(await putPhoto('ads','l/'+Date.now()+'-'+k+'-'+Math.random().toString(36).slice(2,8)+'.jpg',lBlobs[k]));}
var r=await SB.from('listings').insert(row);
if(r.error)throw r.error;
lBlobs=[];await loadListings();render();msg(T('l_done'),true);
}catch(e){msg(T('p_err'));a.disabled=false;}
},
delListing:async function(a){
if(!SB||!me||me.role!=='owner')return;
if(a.getAttribute('data-sure')!=='1'){a.setAttribute('data-sure','1');a.textContent=T('a_sure');setTimeout(function(){if(a.isConnected){a.removeAttribute('data-sure');a.textContent=T('a_del');}},3000);return;}
a.disabled=true;
try{var r=await SB.from('listings').delete().eq('id',a.getAttribute('data-id'));if(r.error)throw r.error;await loadListings();render();}catch(e){a.disabled=false;msg(T('p_err'));}
},
delAd:async function(a){
if(!SB||!me||me.role!=='owner')return;
if(a.getAttribute('data-sure')!=='1'){a.setAttribute('data-sure','1');a.textContent=T('a_sure');setTimeout(function(){if(a.isConnected){a.removeAttribute('data-sure');a.textContent=T('a_del');}},3000);return;}
a.disabled=true;
try{var r=await SB.from('ads').delete().eq('id',a.getAttribute('data-id'));if(r.error)throw r.error;await loadAds();render();}catch(e){a.disabled=false;msg(T('p_err'));}
},
eye:function(a){var el=$(a.getAttribute('data-for'));if(!el)return;var on=el.type==='password';el.type=on?'text':'password';a.setAttribute('aria-pressed',on);a.setAttribute('aria-label',T(on?'hidepass':'showpass'));a.style.color=on?'#D4B06A':'#9AA6BD';var sl=a.querySelector('[data-slash]');if(sl)sl.style.display=on?'':'none';},
invite:async function(a){
if(!me){location.hash='#Login';return;}
var link=LIVE+'/?ref='+encodeURIComponent(me.code)+'#Register',text=T('inv_text').replace('{c}',me.code)+'\n'+link;
try{if(navigator.share){await navigator.share({text:text});return;}}catch(e){if(e&&e.name==='AbortError')return;}
try{await navigator.clipboard.writeText(text);a.setAttribute('title',T('copied'));alert(T('inv_copied'));}catch(e){prompt(T('inv_text').replace('{c}',me.code),link);}
},
copy:async function(a){try{await navigator.clipboard.writeText(me.code);a.textContent=T('copied');}catch(e){}}
};
async function savePlan(){
if(!SB||!me||me.role!=='owner')return;
try{
var rk=st.plan.ranks.filter(function(x){return String(x.name).trim();}).map(function(x,n){return {position:n+1,name:String(x.name).trim(),pv:Number(x.pv)||0,bonus_pct:Number(x.pct)||0};});
var lv=st.plan.levels.map(function(p,n){return {level:n+1,pct:Number(p)||0};});
var e1=(await SB.from('plan_ranks').upsert(rk)).error,e2=(await SB.from('plan_ranks').delete().gt('position',rk.length)).error;
var e3=(await SB.from('plan_levels').upsert(lv)).error,e4=(await SB.from('plan_levels').delete().gt('level',lv.length)).error;
if(e1||e2||e3||e4)throw (e1||e2||e3||e4);
}catch(e){st.saved=false;var s=app.querySelector('[data-act="save"] span');if(s)s.textContent=T('saveerr');}
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sub(h,map){return h.replace(/\{\{([\w.]+)\}\}/g,function(m,k){return (k in map)?map[k]:m;});}
function route(){var r=location.hash.slice(1);return S[r]?r:'Welcome';}
function render(){
var r=route(),i=LANGS.indexOf(st.lang),h=S[r],map={dir:(i===1||i===2)?'rtl':'ltr',code:LANGS[i].toUpperCase(),currentName:NAMES[i]};
if(r==='Admin'){
map.RANKS=st.plan.ranks.map(function(x,n){return sub(X.ROWR,{'r.n':n+1,'r.i':n,'r.name':esc(x.name),'r.pv':esc(x.pv),'r.pct':esc(x.pct)});}).join('');
map.LEVELS=st.plan.levels.map(function(p,n){return sub(X.ROWL,{'l.i':n,'l.label':esc(D[KLEVEL][i])+' '+(n+1),'l.pct':esc(p)});}).join('');
map.SAVE=esc(D[st.saved?KSAVED:KSAVE][i]);
}
if(r==='Welcome'){
map.MENU=st.open?sub(X.MENU,{LROWS:LANGS.map(function(id,n){var on=n===i;return sub(X.LROW,{'l.id':id,'l.bg':on?'#D4B06A':'transparent','l.color':on?'#1A1408':'#F2EEE6','l.name':NAMES[n],'l.code':id.toUpperCase()});}).join('')}):'';
}
if(r==='Network'){map.TEAM=teamHtml(i);if(me&&SB&&!st.teamBusy&&Date.now()-(st.teamAt||0)>5000){st.teamBusy=true;st.teamAt=Date.now();var before=JSON.stringify(stats);loadStats().then(function(){st.teamBusy=false;if(JSON.stringify(stats)!==before&&route()==='Network')render();},function(){st.teamBusy=false;});}}
if(r==='Main'){map.ADS=adsHtml();map.AVATAR=face(me&&me.avatar_url);map.LISTINGS=listingsHtml();}
if(r==='Listings'){map.LISTADMIN=listAdminHtml();}
if(r==='Listing'){var cur=listings.filter(function(x){return x.id===st.lid;})[0];map.LNAME=esc(cur?cur.title:T('l_title'));map.LISTING=listingHtml();}
if(r==='Profile'){map.PROFILE=profileHtml();map.PFOOT=me?'<div style="flex-shrink: 0; padding: 14px 20px 22px; background: #0E1626; border-top: 1px solid #24304A"><div id="msg" role="status" style="min-height: 18px; margin-bottom: 8px; font-size: 13px; line-height: 1.4; color: #FF9B8A; text-align: center"></div><button data-act="saveProfile" style="width: 100%; height: 54px; border-radius: 14px; border: 0; background: #D4B06A; color: #1A1408; font: 600 15px '+FONT+'; cursor: pointer">'+esc(T('p_save'))+'</button></div>':'';}
if(r==='Ads'){map.ADSADMIN=adsAdminHtml();}
if(r==='Network'&&!st.mid)setTimeout(function(){var w=$('tmWrap');if(w&&!w.dataset.c){w.dataset.c=1;var root=w.querySelector('.tm-card');if(root){w.scrollLeft=root.offsetLeft+root.offsetWidth/2-w.clientWidth/2;}}},0);
if(r==='Sales'){map.SALES=salesHtml();if(me&&!st.salesAt){st.salesAt=1;loadSales().then(function(){if(route()==='Sales')render();});}}
if(r!=='Sales')st.salesAt=0;
if((r==='Owner'||r==='Admin'||r==='Ads'||r==='Listings')&&!(me&&me.role==='owner')){h=X.GATE;}
h=sub(h,map).replace(/\{\{t\.(\w+)\}\}/g,function(m,k){return D[k]?esc(D[k][i]):'';});
app.innerHTML=h;document.documentElement.lang=st.lang;
if(r==='Register')initRegister();
if(r==='Welcome')welcomeState();
if(r==='Login'){var em=$('email'),last=get('reg_email');if(em&&last&&!em.value)em.value=last;if(st.loginMsg){msg(T(st.loginMsg),true);st.loginMsg='';}}
if(r==='Register'){var cf=$('code'),ref=get('reg_ref');if(cf&&ref&&!cf.value){cf.value=ref;checkCodeSoon(ref);}}
}
function setLang(l){st.lang=l;put('reg_lang',l);}
app.addEventListener('click',function(e){
var t=e.target.closest?e.target:e.target.parentNode;
var p=t.closest('[data-pick]');if(p){setLang(p.getAttribute('data-pick'));st.open=false;render();return;}
var a=t.closest('[data-act]');if(!a)return;var act=a.getAttribute('data-act');
if(act==='closeSheet'&&a.classList.contains('tm-sheet')&&t.closest('[data-stop]'))return;
if(actions[act]){e.preventDefault();actions[act](a);return;}
if(act==='cycle'){setLang(LANGS[(LANGS.indexOf(st.lang)+1)%4]);}
else if(act==='toggle'){st.open=!st.open;}
else if(act==='addRank'){st.plan.ranks.push({name:'',pv:0,pct:0});st.saved=false;}
else if(act==='addLevel'){st.plan.levels.push(0);st.saved=false;}
else if(act==='save'){put('reg_plan',JSON.stringify(st.plan));st.saved=true;savePlan();}
else return;
render();
});
app.addEventListener('input',function(e){
var t=e.target,n=+t.getAttribute('data-i');
if(t.id==='code'){checkCodeSoon(t.value);return;}
if(t.hasAttribute('data-rf')){st.plan.ranks[n][t.getAttribute('data-rf')]=t.value;}
else if(t.hasAttribute('data-lf')){st.plan.levels[n]=t.value;}
else return;
if(st.saved){st.saved=false;var s=app.querySelector('[data-act="save"] span');if(s)s.textContent=D[KSAVE][LANGS.indexOf(st.lang)];}
});
app.addEventListener('change',function(e){
var t=e.target,f=t.files&&t.files[0];if(!f)return;
if(t.id==='pfFile'){shrink(f,512,function(b){if(!b){msg(T('p_photo_bad'));return;}pf.blob=b;if(pf.url)URL.revokeObjectURL(pf.url);pf.url=URL.createObjectURL(b);var el=$('pfFace');if(el)el.innerHTML=face(pf.url);msg('',true);});}
if(t.id==='adFile'){shrinkAll(t.files,1400,12,function(bs){if(!bs.length){msg(T('p_photo_bad'));return;}adBlobs=bs;picked('adPick',adBlobs);msg('',true);});}
if(t.id==='lFile'){shrinkAll(t.files,1400,8,function(bs){if(!bs.length){msg(T('p_photo_bad'));return;}lBlobs=bs;picked('lPick',lBlobs);msg('',true);});}
});
// The ads move on by themselves every few seconds; a touch on the row pauses them for a while.
var adsHold=0;
app.addEventListener('touchstart',function(e){if(e.target.closest&&e.target.closest('#adsRow'))adsHold=Date.now()+8000;},{passive:true});
setInterval(function(){var row=$('adsRow');if(!row||row.children.length<2||Date.now()<adsHold||document.hidden)return;var w=row.children[0].getBoundingClientRect().width+12,n=Math.round(Math.abs(row.scrollLeft)/w)+1,rtl=getComputedStyle(row).direction==='rtl';if(n>=row.children.length)n=0;row.scrollTo({left:(rtl?-1:1)*n*w,behavior:'smooth'});},4500);
app.addEventListener('submit',function(e){e.preventDefault();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&st.mid){st.mid=null;render();}});
window.addEventListener('hashchange',function(){st.open=false;st.mid=null;if(route()!=='Profile'){pf={blob:null,url:''};}if(route()!=='Ads')adBlobs=[];if(route()!=='Listings')lBlobs=[];render();});
// Opened from the home-screen icon, iOS reports a viewport shorter than the screen, which left an empty strip
// under the app. There the app takes the real screen height, so it fills the screen edge to edge.
function fitScreen(){
var alone=navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
if(document.body.classList.contains('nl-fixed')||!alone){app.style.height='';return;}
var h=Math.max(window.innerHeight,document.documentElement.clientHeight),full=window.innerWidth>window.innerHeight?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);
if(full>h&&full-h<160)h=full;
app.style.height=h+'px';
}
fitScreen();window.addEventListener('resize',fitScreen);window.addEventListener('orientationchange',function(){setTimeout(fitScreen,300);});
render();
[1500,4000,9000].forEach(function(ms){setTimeout(function(){var b=document.getElementById('nl-badge-frame');document.body.classList.toggle('nl-fixed',!!b&&getComputedStyle(b).position==='fixed');fitScreen();},ms);});
loadAds().then(loadListings).then(function(){if(route()==='Main'||route()==='Listing')render();});
checkOwner();
loadMe().then(function(){if(me&&(!location.hash||['Welcome','Login','Register'].indexOf(route())>=0)){location.hash='#Main';}render();});
})();
</script>
